<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Upcoming Events — Edugrow</title>
  <meta name="description" content="Upcoming Edugrow events. Coming soon. Follow us to hear first.">
  <link rel="icon" href="assets/img/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="assets/js/main.js" defer></script>
</head>
<body data-page="upcoming" class="on-dark">
  <div id="site-header"></div>

  <main id="main">
    <section class="soon">
      <div class="bubbles" aria-hidden="true"></div>
      <div class="container" style="position:relative;z-index:2">
        <span class="hand reveal" style="color:var(--sun)">Upcoming events</span>
        <h1 data-split>Coming <span class="y">soon!</span></h1>
        <div class="pencil-loader" aria-hidden="true"><span></span></div>
        <p class="lead reveal" style="margin-inline:auto">We're planning our next events right now. Follow Edugrow to be the first to hear, or sign up to volunteer so we can reach you directly.</p>
        <div class="btn-row reveal" style="justify-content:center;margin-top:30px">
          <a class="btn" href="https://www.instagram.com/ngo.edugrow/" target="_blank" rel="noopener" data-magnetic>Follow on Instagram <span data-icon="instagram" data-size="16"></span></a>
          <a class="btn btn--ghost" href="volunteer.html">Volunteer</a>
        </div>
        <p class="reveal" style="margin-top:44px;color:#9FBDCD">Meanwhile, catch up on <a href="success-stories.html" style="color:var(--sun);font-weight:700">past events →</a></p>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
</body>
</html>
